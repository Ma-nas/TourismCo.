name: Multi-Project Keep-Alive Daemon

on:
  schedule:
    # Triggers every 12 minutes (UTC) to prevent 15-minute hibernation cycles
    - cron: '*/12 * * * *'
  workflow_dispatch:
    inputs:
      project_1_override:
        description: 'Optional URL override for Project 1'
        required: false
        default: ''
      project_2_override:
        description: 'Optional URL override for Project 2'
        required: false
        default: ''
      project_3_override:
        description: 'Optional URL override for Project 3'
        required: false
        default: ''

jobs:
  heartbeat:
    name: Ping Deployed Instances
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to Projects
        env:
          PROJECT_1_URL: ${{ github.event.inputs.project_1_override || secrets.PROJECT_1_URL || 'https://tourismco-backend.onrender.com' }}
          PROJECT_2_URL: ${{ github.event.inputs.project_2_override || secrets.PROJECT_2_URL || 'https://your-project-2.onrender.com' }}
          PROJECT_3_URL: ${{ github.event.inputs.project_3_override || secrets.PROJECT_3_URL || 'https://your-project-3.onrender.com' }}
        run: |
          echo "======================================================"
          echo " Starting Multi-Project Keep-Alive Daemon"
          echo " Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "======================================================"

          ping_url() {
            local proj_name="$1"
            local target_url="$2"

            if [ -z "$target_url" ]; then
              echo "ℹ️  [$proj_name] No URL provided. Skipping."
              return 0
            fi

            echo "🌐 Pinging [$proj_name]: $target_url ..."
            local start_time=$(date +%s)
            local http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$target_url" || echo "FAILED")
            local end_time=$(date +%s)
            local duration=$((end_time - start_time))

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
              echo "🟢 [$proj_name] Status: $http_code (Latency: ${duration}s)"
            elif [ "$http_code" = "FAILED" ]; then
              echo "🔴 [$proj_name] Status: CONNECTION FAILED / TIMEOUT (Latency: ${duration}s)"
            else
              echo "🟡 [$proj_name] Status: $http_code (Latency: ${duration}s)"
            fi
          }

          ping_url "Project 1 (TourismCo Backend)" "$PROJECT_1_URL"
          echo "------------------------------------------------------"
          ping_url "Project 2" "$PROJECT_2_URL"
          echo "------------------------------------------------------"
          ping_url "Project 3" "$PROJECT_3_URL"
          echo "======================================================"
          echo " Heartbeat cycle complete."
